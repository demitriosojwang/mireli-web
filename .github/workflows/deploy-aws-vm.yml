name: Deploy Mireli to AWS VM

on:
  workflow_run:
    workflows: [Verify Mireli Web]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    name: Publish and deploy approved main build
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      vars.MIRELI_AWS_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: production
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
      ECR_REPOSITORY_URI: ${{ vars.MIRELI_ECR_REPOSITORY_URI }}
      EC2_INSTANCE_ID: ${{ vars.MIRELI_EC2_INSTANCE_ID }}
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
      RELEASE_TAG: ${{ github.event.workflow_run.head_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          [[ "$AWS_REGION" == "eu-north-1" ]]
          [[ "$AWS_DEPLOY_ROLE_ARN" =~ ^arn:aws:iam::[0-9]{12}:role/[A-Za-z0-9+=,.@_/-]+$ ]]
          [[ "$ECR_REPOSITORY_URI" =~ ^[0-9]{12}\.dkr\.ecr\.${AWS_REGION}\.amazonaws\.com/[a-z0-9._/-]+$ ]]
          [[ "$EC2_INSTANCE_ID" =~ ^i-([0-9a-f]{8}|[0-9a-f]{17})$ ]]
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RELEASE_TAG" =~ ^[0-9a-f]{40}-[0-9]+-[0-9]+$ ]]

      - name: Check out the exact commit that passed verification
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}

      - name: Configure short-lived AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: mireli-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Confirm AWS identity
        run: aws sts get-caller-identity

      - name: Log in to the immutable ECR repository
        env:
          REGISTRY: ${{ env.ECR_REPOSITORY_URI }}
        run: |
          set -euo pipefail
          registry="${REGISTRY%%/*}"
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "$registry"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build and publish the tested ARM64 release image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          platforms: linux/arm64
          push: true
          tags: ${{ env.ECR_REPOSITORY_URI }}:${{ env.RELEASE_TAG }}
          labels: |
            org.opencontainers.image.revision=${{ env.SOURCE_SHA }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Deploy through Systems Manager and roll back if health checks fail
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RELEASE_TAG" > "$RUNNER_TEMP/ssm-parameters.json" <<'PY'
          import json
          import re
          import sys

          tag = sys.argv[1]
          if not re.fullmatch(r"[0-9a-f]{40}-[0-9]+-[0-9]+", tag):
              raise SystemExit("Release tag did not pass validation")

          script = f"""set -Eeuo pipefail
          new_tag='{tag}'
          config=/etc/mireli/bootstrap.env
          service=mireli-app
          test -r "$config"
          old_tag=$(python3 -c 'import pathlib,re,sys; s=pathlib.Path(sys.argv[1]).read_text(); m=re.search(r"(?m)^IMAGE_TAG=[\\x27\\\"]?([A-Za-z0-9._-]+)", s); print(m.group(1) if m else "")' "$config")
          [[ "$old_tag" =~ ^[A-Za-z0-9._-]+$ ]]
          set_tag() {{ NEW_TAG="$1" python3 -c 'import os,pathlib,re,sys; p=pathlib.Path(sys.argv[1]); s=p.read_text(); t=os.environ["NEW_TAG"]; s,n=re.subn(r"(?m)^IMAGE_TAG=.*$", "IMAGE_TAG=\\x27"+t+"\\x27", s, count=1); assert n == 1; p.write_text(s); os.chmod(p,0o600)' "$config"; }}
          healthy() {{ for n in $(seq 1 36); do curl --fail --silent http://127.0.0.1:3000/api/health >/dev/null 2>&1 && return 0; sleep 5; done; return 1; }}
          rollback() {{ echo 'New release failed health check; restoring previous image.'; set_tag "$old_tag"; systemctl restart "$service" || true; healthy; }}
          set_tag "$new_tag"
          systemctl restart "$service" || true
          if healthy; then echo "Release $new_tag is healthy."; exit 0; fi
          rollback || {{ echo 'Rollback image did not pass the local health check.'; exit 2; }}
          exit 1
          """
          print(json.dumps({"commands": [script]}))
          PY

          command_id=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Mireli release $SOURCE_SHA" \
            --parameters "file://$RUNNER_TEMP/ssm-parameters.json" \
            --query 'Command.CommandId' \
            --output text)
          echo "SSM deployment command: $command_id"

          status=Pending
          for _ in $(seq 1 150); do
            status=$(aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query Status \
              --output text 2>/dev/null || true)
            case "$status" in
              Success|Cancelled|TimedOut|Failed|Cancelling|DeliveryTimedOut|ExecutionTimedOut|Undeliverable|Terminated) break ;;
              *) sleep 10 ;;
            esac
          done
          aws ssm get-command-invocation \
            --command-id "$command_id" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query '{status:Status,stdout:StandardOutputContent,stderr:StandardErrorContent}' \
            --output json
          [[ "$status" == Success ]]
