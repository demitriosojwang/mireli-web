name: Mint staff enrollment code

# One-off ops tool: prints a fresh 30-minute staff setup code for an
# allowlisted email by executing inside the running production container
# (which holds STAFF_AUTH_SECRET). Dispatch-only; never runs on push.

on:
  workflow_dispatch:
    inputs:
      email:
        description: Staff email to mint the setup code for
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: mireli-production-deploy
  cancel-in-progress: false

jobs:
  mint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
      EC2_INSTANCE_ID: ${{ vars.MIRELI_EC2_INSTANCE_ID }}
      TARGET_EMAIL: ${{ github.event.inputs.email }}
    steps:
      - name: Configure AWS credentials with the deploy user
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_DEPLOY_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_DEPLOY_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Mint the code inside the running app container
        shell: bash
        run: |
          set -euo pipefail
          $emailJson = ($env:TARGET_EMAIL | ConvertTo-Json -Compress)
          $script = @"
#!/bin/bash
set -euo pipefail
C=`$(docker ps --format '{{.Names}}' | awk '$1 == "mireli" {print `$1; exit}')
[[ -n "`$C" ]] || { echo 'No running app container found'; exit 1; }
docker exec -e TARGET_EMAIL=$emailJson "`$C" node -e '
const c = require("node:crypto");
const secret = process.env.STAFF_AUTH_SECRET;
const email = (process.env.TARGET_EMAIL || "").trim().toLowerCase();
if (!secret || secret.length < 32) { console.error("STAFF_AUTH_SECRET not configured"); process.exit(1); }
if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { console.error("Invalid email"); process.exit(1); }
const allow = (process.env.MIRELI_STAFF_EMAILS || "").split(",").map(s => s.trim().toLowerCase()).filter(Boolean);
if (!allow.includes(email)) { console.error("Email is not on the staff allowlist"); process.exit(2); }
const payload = (Date.now() + 30 * 60 * 1000) + "." + c.randomBytes(12).toString("base64url");
const sig = c.createHmac("sha256", secret).update("staff:enrollment:" + email + ":" + payload).digest("base64url");
console.log(payload + "." + sig);
'
"@
          $script | Set-Content -Path "$env:RUNNER_TEMP/mint.sh" -NoNewline -Encoding ascii
          $json = @{ commands = @((Get-Content "$env:RUNNER_TEMP/mint.sh" -Raw)) } | ConvertTo-Json -Compress -Depth 3
          Set-Content -Path "$env:RUNNER_TEMP/ssm-parameters.json" -Value $json -Encoding ascii
        shell: pwsh
          command_id=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Mint staff enrollment code" \
            --parameters "file://$RUNNER_TEMP/ssm-parameters.json" \
            --query 'Command.CommandId' \
            --output text)
          status=Pending
          for _ in $(seq 1 30); do
            if status=$(aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query Status \
              --output text 2>/dev/null); then
              case "$status" in Success|Failed|Cancelled|TimedOut|Undeliverable) break ;; esac
            fi
            sleep 2
          done
          aws ssm get-command-invocation \
            --command-id "$command_id" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query '{status:Status,stdout:StandardOutputContent,stderr:StandardErrorContent}' \
            --output json
          [[ "$status" == Success ]]
