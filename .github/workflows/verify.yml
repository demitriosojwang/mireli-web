name: Verify Mireli Web
on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://mireli:ci_placeholder@127.0.0.1:5432/mireli
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run db:validate
      - run: npm run db:generate
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

  container:
    name: Build production container (AMD64 + ARM64)
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Validate the local single-container Compose stack
        run: docker compose --env-file .env.docker.example config --quiet
      - name: Build and test the Linux application image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: test
          platforms: linux/amd64
          push: false
          tags: mireli-web:ci-test
          cache-from: |
            type=gha,scope=mireli-amd64-${{ github.event_name }}
            type=gha,scope=mireli-amd64
          cache-to: type=gha,mode=max,scope=mireli-amd64-${{ github.event_name }}
      - name: Build the deployable AMD64 image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runner
          platforms: linux/amd64
          push: false
          tags: mireli-web:ci-release-check-amd64
          cache-from: |
            type=gha,scope=mireli-amd64-${{ github.event_name }}
            type=gha,scope=mireli-amd64
          cache-to: type=gha,mode=max,scope=mireli-amd64-${{ github.event_name }}

  container-arm64:
    name: Build production container (ARM64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build and test the ARM64 Linux application image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: test
          platforms: linux/arm64
          push: false
          tags: mireli-web:ci-test-arm64
          cache-from: |
            type=gha,scope=mireli-arm64-${{ github.event_name }}
            type=gha,scope=mireli-arm64
          cache-to: type=gha,mode=max,scope=mireli-arm64-${{ github.event_name }}
      - name: Build the deployable ARM64 image for the VM
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runner
          platforms: linux/arm64
          push: false
          tags: mireli-web:ci-release-check-arm64
          cache-from: |
            type=gha,scope=mireli-arm64-${{ github.event_name }}
            type=gha,scope=mireli-arm64
          cache-to: type=gha,mode=max,scope=mireli-arm64-${{ github.event_name }}

  aws-infrastructure:
    name: Validate AWS VM infrastructure
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install pinned CloudFormation linter
        run: python -m pip install --disable-pip-version-check --no-cache-dir cfn-lint==1.57.2
      - name: Lint the eu-north-1 VM template
        run: cfn-lint --format json --regions eu-north-1 -- infra/aws/mireli-vm.yaml
      - name: Install pinned AWS CloudFormation Guard
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/cfn-guard-v3.2.1-linux.tar.gz"
          curl --fail --location --silent --show-error \
            https://github.com/aws-cloudformation/cloudformation-guard/releases/download/3.2.1/cfn-guard-v3-x86_64-linux-latest.tar.gz \
            --output "$archive"
          echo '8c66efb19c63e6c2bf26b9a41bbcf2f85baa8a937b01d350940194faaf64cf1d  '"$archive" | sha256sum --check --status
          extract="$RUNNER_TEMP/cfn-guard-extract"
          bin="$RUNNER_TEMP/cfn-guard-bin"
          mkdir -p "$extract" "$bin"
          tar -xzf "$archive" -C "$extract"
          guard=$(find "$extract" -type f -name cfn-guard -print -quit)
          test -n "$guard"
          install -m 0755 "$guard" "$bin/cfn-guard"
          echo "$bin" >> "$GITHUB_PATH"
      - name: Check the template against the AWS CIS Foundations Level 1 rules
        run: >-
          cfn-guard validate
          --rules infra/aws/guard-rules/cis-aws-benchmark-level-1.guard
          --data infra/aws/mireli-vm.yaml
          --output-format json
