AWSTemplateFormatVersion: '2010-09-09'
Description: Private Mireli driver evidence with GuardDuty scanning in the existing Mireli Region.

Parameters:
  RuntimeRoleArn:
    Type: String
    AllowedPattern: 'arn:aws:iam::[0-9]{12}:role/[A-Za-z0-9+=,.@_/-]+'
    Description: ARN of the existing Mireli EC2 runtime IAM role, not the instance profile ARN.

Resources:
  DriverDocuments:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: application
          Value: mireli
        - Key: data-classification
          Value: private-driver-evidence

  GuardDutyScanner:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: malware-protection-plan.guardduty.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ScanDriverEvidence
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ManageGuardDutyEventRule
                Effect: Allow
                Action: [events:PutRule, events:DeleteRule, events:PutTargets, events:RemoveTargets]
                Resource: !Sub 'arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:rule/DO-NOT-DELETE-AmazonGuardDutyMalwareProtectionS3*'
                Condition:
                  StringEquals:
                    events:ManagedBy: malware-protection-plan.guardduty.amazonaws.com
              - Sid: ReadGuardDutyEventRule
                Effect: Allow
                Action: [events:DescribeRule, events:ListTargetsByRule]
                Resource: !Sub 'arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:rule/DO-NOT-DELETE-AmazonGuardDutyMalwareProtectionS3*'
              - Sid: SetNotificationsAndCheckBucketOwnership
                Effect: Allow
                Action: [s3:PutBucketNotification, s3:GetBucketNotification, s3:ListBucket]
                Resource: !GetAtt DriverDocuments.Arn
              - Sid: WriteValidationObject
                Effect: Allow
                Action: s3:PutObject
                Resource: !Sub '${DriverDocuments.Arn}/malware-protection-resource-validation-object'
              - Sid: ReadAndTagScannedEvidence
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                  - s3:GetObjectTagging
                  - s3:GetObjectVersionTagging
                  - s3:PutObjectTagging
                  - s3:PutObjectVersionTagging
                Resource: !Sub '${DriverDocuments.Arn}/driver-documents/*'

  DriverDocumentsPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref DriverDocuments
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyPlainHttp
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource: [!GetAtt DriverDocuments.Arn, !Sub '${DriverDocuments.Arn}/*']
            Condition:
              Bool:
                aws:SecureTransport: 'false'
          - Sid: DenyReadUntilClean
            Effect: Deny
            Principal: '*'
            Action: [s3:GetObject, s3:GetObjectVersion]
            Resource: !Sub '${DriverDocuments.Arn}/driver-documents/*'
            Condition:
              ArnNotEquals:
                aws:PrincipalArn: !GetAtt GuardDutyScanner.Arn
              StringNotEquals:
                s3:ExistingObjectTag/GuardDutyMalwareScanStatus: NO_THREATS_FOUND
          - Sid: AllowOnlyScannerToChangeTags
            Effect: Deny
            Principal: '*'
            Action:
              - s3:PutObjectTagging
              - s3:PutObjectVersionTagging
              - s3:DeleteObjectTagging
              - s3:DeleteObjectVersionTagging
            Resource: !Sub '${DriverDocuments.Arn}/driver-documents/*'
            Condition:
              ArnNotEquals:
                aws:PrincipalArn: !GetAtt GuardDutyScanner.Arn
          - Sid: DenyUploadWithScanTag
            Effect: Deny
            Principal: '*'
            Action: s3:PutObject
            Resource: !Sub '${DriverDocuments.Arn}/driver-documents/*'
            Condition:
              ForAnyValue:StringEquals:
                s3:RequestObjectTagKeys: GuardDutyMalwareScanStatus
          - Sid: RequireNewObjectKey
            Effect: Deny
            Principal: '*'
            Action: s3:PutObject
            Resource: !Sub '${DriverDocuments.Arn}/driver-documents/*'
            Condition:
              StringNotEquals:
                s3:if-none-match: '*'
          - Sid: AllowRuntimeToVerifyBucketPrivacy
            Effect: Allow
            Principal:
              AWS: !Ref RuntimeRoleArn
            Action: s3:GetBucketPublicAccessBlock
            Resource: !GetAtt DriverDocuments.Arn
          - Sid: AllowRuntimeEvidenceOperations
            Effect: Allow
            Principal:
              AWS: !Ref RuntimeRoleArn
            Action: [s3:PutObject, s3:DeleteObject, s3:GetObject, s3:GetObjectTagging]
            Resource: !Sub '${DriverDocuments.Arn}/driver-documents/*'

  MalwareProtection:
    Type: AWS::GuardDuty::MalwareProtectionPlan
    DependsOn: DriverDocumentsPolicy
    Properties:
      Role: !GetAtt GuardDutyScanner.Arn
      ProtectedResource:
        S3Bucket:
          BucketName: !Ref DriverDocuments
          ObjectPrefixes: [driver-documents/]
      Actions:
        Tagging:
          Status: ENABLED

Outputs:
  DriverDocumentBucketName:
    Description: Set as DRIVER_DOCUMENT_BUCKET in the Mireli runtime secret.
    Value: !Ref DriverDocuments
  MalwareProtectionPlanId:
    Value: !GetAtt MalwareProtection.MalwareProtectionPlanId
